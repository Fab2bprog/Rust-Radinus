<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Classification rapide des opérations</title>
    <script type="module" src="/ui/windows/quick-classification.ts" defer></script>
  </head>

  <body>
    <!-- F05 — « Classification rapide des opérations »
         (04_SPECIFICATIONS_FENETRES.md F05, capture « classification rapide
         operation.png »).

         La structure est celle de l'original, de haut en bas : le menu
         Période, le bandeau gris des deux dates, le bandeau gris des six
         caractéristiques, le grand tableau, et le panneau bleu à droite avec
         les engrenages, l'enregistrement et la porte.

         **Les six cases arment leurs menus** : décochée, la liste déroulante
         est morte, et tout le bloc est grisé — c'est ce que montre la capture,
         et c'est ce qui dit à l'utilisateur qu'il n'a encore rien demandé. -->
    <div class="window window--quick">
      <nav class="window-menu" id="window-menu"></nav>

      <section class="band">
        <h2 class="band__title" id="dates-title"></h2>
        <div class="band__line">
          <label for="from" id="from-label"></label>
          <input id="from" type="date" />
          <label for="to" id="to-label"></label>
          <input id="to" type="date" />
        </div>
      </section>

      <section class="band">
        <h2 class="band__title" id="change-title"></h2>
        <!-- Les six paires case + menu, sur deux colonnes comme l'original :
             Categorie / Affectation / Mode à gauche, Tiers / Projet / Status à
             droite. Elles sont bâties par le script, à partir de la liste que
             Rust lui donne — six blocs recopiés à la main seraient six endroits
             où oublier la même correction. -->
        <div class="characteristics" id="characteristics"></div>
      </section>

      <main class="window__content">
        <section class="list">
          <header class="list__header" id="header"></header>
          <div class="list__filter" id="filter"></div>
          <div class="list__rows" id="rows" role="listbox" aria-multiselectable="true"></div>
        </section>
      </main>

      <aside class="panel">
        <button class="panel__button" id="apply" type="button" disabled>
          <img src="/ui/assets/icons/Base_work.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="save" type="button">
          <img src="/ui/assets/icons/Base_save.png" alt="" />
        </button>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar"></footer>
    </div>
  </body>
</html>
