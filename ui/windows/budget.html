<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Budget</title>
    <script type="module" src="/ui/windows/budget.ts" defer></script>
  </head>

  <body>
    <!-- F26 « Saisie du budget » et F27 « Contrôle du budget ».

         **Une page, deux fenêtres** : c'est le même tableau — les postes
         budgétaires en lignes, les douze mois en colonnes — et la même
         navigation par année que les statistiques. Ce qui change, c'est la
         question : on saisit, ou on contrôle.

         En saisie, les cases se tapent et le bandeau rouge rappelle la
         convention de signe. En contrôle, les cases se lisent et se colorent,
         et l'interrupteur bascule entre les valeurs et les pourcentages. -->
    <div class="window window--budget">
      <!-- L'interrupteur du contrôle, comme dans les statistiques : Valeurs
           d'un côté, Pourcentages de l'autre (Fabrice, 29/07/2026). Absent de
           la saisie, qui n'a rien à basculer. -->
      <nav class="switches" id="switches" hidden></nav>

      <main class="window__content">
        <section class="matrix" id="matrix-zone">
          <div class="matrix__grid" id="matrix" role="grid"></div>
        </section>
      </main>

      <aside class="panel panel--statistics">
        <button class="panel__year" id="year" type="button"></button>
        <button class="panel__button" id="next-year" type="button">
          <img src="/ui/assets/icons/Temps_Plus.png" alt="" />
        </button>
        <button class="panel__button" id="previous-year" type="button">
          <img src="/ui/assets/icons/Temps_Moins.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="save" type="button" hidden>
          <img src="/ui/assets/icons/Base_save.png" alt="" />
        </button>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar"></footer>
    </div>
  </body>
</html>
