<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Protection par mot de passe</title>
    <script type="module" src="/ui/windows/password-form.ts" defer></script>
  </head>

  <body>
    <!-- La fiche du mot de passe d'une base (décision de Fabrice, 05/08/2026).

         **Trois champs, et une seule fiche pour trois gestes** : poser un mot
         de passe (l'ancien reste vide), le changer (les trois sont remplis),
         le retirer (l'ancien est rempli, les deux nouveaux restent vides).
         C'est la procédure de saisie que Fabrice a dictée, et c'est celle que
         tout le monde connaît — « je n'invente rien », dit-il, et c'est bien
         la raison de la garder telle quelle.

         Le nouveau mot de passe est demandé **deux fois**, parce qu'on ne voit
         pas ce qu'on tape : deux saisies identiques sont la seule façon de
         savoir qu'on a tapé ce qu'on croyait.

         Gabarit des fiches de Radinus (03_CHARTE_GRAPHIQUE.md §3.3) : bandeau
         d'image à gauche, les champs au milieu, enregistrer et la porte à
         droite, la barre d'état en bas. -->
    <div class="window">
      <aside class="panel panel--left">
        <img
          class="panel__image"
          src="/ui/assets/icons/ImgRadinusClassement.png"
          alt=""
        />
      </aside>

      <main class="window__content window__content--scroll">
        <section class="band">
          <h2 class="band__title" id="group-database"></h2>
          <!-- Quelle base on est en train de protéger. Sans cette ligne, la
               fiche serait un formulaire sans sujet : le tableau est derrière
               elle, et l'on ne voit plus quelle ligne on avait choisie. -->
          <p class="pane__hint" id="database-name"></p>
        </section>

        <section class="band">
          <h2 class="band__title" id="group-password"></h2>
          <div class="form form--wide">
            <label class="form__label" for="old" id="old-caption"></label>
            <input
              class="form__field form__field--medium"
              id="old"
              type="password"
              autocomplete="current-password"
              maxlength="120"
            />

            <label class="form__label" for="fresh" id="fresh-caption"></label>
            <input
              class="form__field form__field--medium"
              id="fresh"
              type="password"
              autocomplete="new-password"
              maxlength="120"
            />

            <label class="form__label" for="repeat" id="repeat-caption"></label>
            <input
              class="form__field form__field--medium"
              id="repeat"
              type="password"
              autocomplete="new-password"
              maxlength="120"
            />

            <!-- **Montrer ce qu'on tape** (Fabrice, 05/08/2026) : « certaines
                 fois l'utilisateur est seul dans la pièce, il n'y a personne
                 qui regarde ». Elle découvre **les trois champs**, l'ancien
                 compris — je l'avais d'abord réservée à la saisie double, et
                 Fabrice a corrigé : on tape l'ancien mot de passe tout aussi à
                 l'aveugle que les deux autres. -->
            <span></span>
            <label class="form__check">
              <input id="reveal" type="checkbox" />
              <span id="reveal-label"></span>
            </label>
          </div>
          <p class="pane__hint" id="password-hint"></p>
        </section>

        <!-- **Le prix, écrit là où on le lit avant d'agir** et non dans un
             message qui viendrait après. Un mot de passe oublié est une base
             perdue : c'est le principe du chiffrement, il n'y a pas de porte
             de service, et cela se dit avant. -->
        <section class="band">
          <h2 class="band__title" id="group-warning"></h2>
          <p class="pane__hint" id="warning"></p>
        </section>
      </main>

      <aside class="panel">
        <button class="panel__button" id="save" type="button">
          <img src="/ui/assets/icons/Base_save.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar">…</footer>
    </div>
  </body>
</html>
