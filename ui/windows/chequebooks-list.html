<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Liste des chequiers</title>
    <script type="module" src="/ui/windows/chequebooks-list.ts" defer></script>
  </head>

  <body>
    <!-- F13 — « Liste des chequiers » (capture « Liste des chequiers.png »).

         Cinq colonnes : LIBELLE (la référence du carnet), Date de réception,
         NomCompte, Num Compte, Commentaires. **Tous les carnets, tous comptes
         confondus** — ces deux colonnes de compte ne serviraient à rien si la
         fenêtre n'en montrait qu'un (arbitrage de Fabrice, 28/07/2026), et
         c'est pourquoi le ⌘F7 ouvre directement, sans demander de compte.

         Panneau de droite : créer, modifier, supprimer, voir la composition
         (le carnet), et la porte. -->
    <div class="window">
      <main class="window__content">
        <!-- Le mode « choisir » (son ModeListe = "SEL") pose sa question
             au-dessus du tableau et efface les boutons de gestion. -->
        <h1 class="window__question" id="question" hidden></h1>
        <section class="list">
          <header class="list__header" id="header"></header>
          <div class="list__filter" id="filter"></div>
          <div class="list__rows" id="rows" role="listbox" aria-multiselectable="true"></div>
        </section>
      </main>

      <aside class="panel">
        <button class="panel__button" id="create" type="button">
          <img src="/ui/assets/icons/Base_create.png" alt="" />
        </button>
        <button class="panel__button" id="update" type="button">
          <img src="/ui/assets/icons/Base_update.png" alt="" />
        </button>
        <button class="panel__button" id="delete" type="button">
          <img src="/ui/assets/icons/Base_delete.png" alt="" />
        </button>
        <button class="panel__button" id="composition" type="button">
          <img src="/ui/assets/icons/chequier.png" alt="" />
        </button>
        <button class="panel__button" id="select" type="button" hidden>
          <img src="/ui/assets/icons/Base_select.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar"></footer>
    </div>
  </body>
</html>
