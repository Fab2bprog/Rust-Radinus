<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Importation de feuille excel : association des données</title>
    <script type="module" src="/ui/windows/excel-association.ts" defer></script>
  </head>

  <body>
    <!-- « Importation de feuille excel : association des données » (captures
         « association categorie.png » et la maquette WinDev de Fabrice).

         **Une seule fenêtre pour les trois nomenclatures.** Sa maquette porte
         quatre colonnes — Données_Excel, Categorie_Radinus,
         MoyenPaiement_Radinus, Affectation_Radinus — et n'en montre qu'une à
         la fois selon le type demandé ; c'est ce que fait son
         `SELON TypeTriXls`. Trois usages, un seul code.

         À gauche les libellés que Radinus ne connaît pas, un par ligne. À
         droite une combo qui **ne propose que l'existant** (règle de Fabrice,
         29/07/2026) : cette fenêtre sert à ranger « Alimentationss » dans
         « Alimentation », pas à créer une valeur. -->
    <div class="window window--excel">
      <main class="window__content window__content--scroll">
        <p class="excel-note" id="help"></p>
        <section class="list list--excel">
          <header class="list__header" id="header"></header>
          <div class="list__filter" id="filter"></div>
          <div class="list__rows" id="rows" role="listbox"></div>
        </section>
      </main>

      <aside class="panel">
        <span class="panel__spacer"></span>
        <button class="panel__button" id="validate" type="button">
          <img src="/ui/assets/icons/Base_valid.png" alt="" />
        </button>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar"></footer>
    </div>
  </body>
</html>
