<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Proposition de calendrier des opérations à insérer dans vos compte bancaires</title>
    <script type="module" src="/ui/windows/recurring-calendar.ts" defer></script>
  </head>

  <body>
    <!-- F16 — « Proposition de calendrier des opérations à insérer dans vos
         compte bancaires » (capture du dossier « Information Operations
         Periodiques »).

         **Rien n'est encore écrit.** Cette fenêtre montre ce que les règles
         choisies produiraient : neuf colonnes, une ligne par échéance, et
         jusqu'à cent par règle.

         Deux gestes, dans cet ordre. La **corbeille rouge** retire de la
         proposition les échéances qu'on ne veut pas — sa barre du bas le dit
         mot pour mot, la multi-sélection est là « en vue de leur suppression ».
         Puis le calendrier-disquette insère ce qui reste.

         Ce qui a été retiré n'est pas perdu : la règle se décale d'après la
         dernière échéance **réellement insérée**, donc les lignes écartées
         reviendront dans la proposition suivante. -->
    <div class="window">
      <main class="window__content">
        <section class="list">
          <header class="list__header" id="header"></header>
          <div class="list__filter" id="filter"></div>
          <div class="list__rows" id="rows" role="listbox" aria-multiselectable="true"></div>
        </section>
      </main>

      <aside class="panel">
        <button class="panel__button" id="remove" type="button">
          <img src="/ui/assets/icons/calendrierpoubelle.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="insert" type="button">
          <img src="/ui/assets/icons/calendrierdisquette.png" alt="" />
        </button>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar"></footer>
    </div>
  </body>
</html>
