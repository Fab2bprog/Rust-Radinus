<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Liste des operations periodiques</title>
    <script type="module" src="/ui/windows/recurring-list.ts" defer></script>
  </head>

  <body>
    <!-- F38 — « Liste des operations periodiques » (capture du dossier
         « Information Operations Periodiques »).

         Le gabarit des listes de Radinus : une seule colonne LIBELLE avec son
         entonnoir, et le panneau — créer, modifier, supprimer, consulter,
         **le calendrier**, puis la porte.

         Le calendrier est la seule icône que les autres listes n'ont pas, et
         c'est elle qui fait tout le travail de cette phase : elle demande à
         une ou plusieurs règles ce qu'elles proposeraient, sans rien écrire.

         Multi-sélection : sa barre du bas l'annonce, et le calendrier sait
         empiler les échéances de plusieurs règles. -->
    <div class="window">
      <main class="window__content">
        <section class="list">
          <header class="list__header" id="header"></header>
          <div class="list__filter" id="filter"></div>
          <div class="list__rows" id="rows" role="listbox" aria-multiselectable="true"></div>
        </section>
      </main>

      <aside class="panel">
        <button class="panel__button" id="create" type="button">
          <img src="/ui/assets/icons/Base_create.png" alt="" />
        </button>
        <button class="panel__button" id="update" type="button">
          <img src="/ui/assets/icons/Base_update.png" alt="" />
        </button>
        <button class="panel__button" id="delete" type="button">
          <img src="/ui/assets/icons/Base_delete.png" alt="" />
        </button>
        <button class="panel__button" id="read" type="button">
          <img src="/ui/assets/icons/Base_read.png" alt="" />
        </button>
        <button class="panel__button" id="calendar" type="button">
          <img src="/ui/assets/icons/calendrier.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar"></footer>
    </div>
  </body>
</html>
