<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Préférences</title>
    <script type="module" src="/ui/windows/preferences.ts" defer></script>
  </head>

  <body>
    <!-- F39 — « Préférences » (04_SPECIFICATIONS_FENETRES.md F39, phase 17 ter).
         Fenêtre nouvelle, sans équivalent en 1.9.3.

         Arbre à gauche, champs de l'option choisie au milieu, bande ardoise à
         droite avec la disquette et la porte : le gabarit des fiches, dans le
         sens de toutes les autres fenêtres de Radinus.

         **Trois options écrivent dans la table `Preferences`** : la devise,
         la vérification des opérations importées (03/10/2026) et le tarif
         d'électricité (09/10/2026).
         La langue, elle, reste dans `Parametres.UtiliseLangue` où elle a
         toujours été — la fenêtre écrit donc à deux endroits, et c'est voulu
         (décision de Fabrice, 03/08/2026). Rien d'autre n'entre dans
         `Preferences` sans qu'il l'ait demandé. -->
    <div class="window window--preferences">
      <nav class="tree" id="tree" aria-label="Options"></nav>

      <main class="window__content">
        <!-- Feuille « Langue ». Le même choix que l'entrée de menu, qui reste
             en place : deux chemins, un seul réglage. -->
        <section class="pane" id="pane-language" hidden>
          <h2 class="pane__title" id="language-title"></h2>
          <div class="form">
            <label class="form__label" for="language" id="language-label"></label>
            <select class="form__field" id="language"></select>
          </div>
        </section>

        <!-- Feuille « Devise ». -->
        <section class="pane" id="pane-currency" hidden>
          <h2 class="pane__title" id="currency-title"></h2>
          <div class="form">
            <label class="form__label" for="currency" id="currency-label"></label>
            <select class="form__field" id="currency"></select>

            <!-- N'apparaît que sur « Personnalisé » : un champ éteint qu'on ne
                 peut pas remplir est un champ qui ne sert à rien. -->
            <label class="form__label" for="custom" id="custom-label" hidden></label>
            <input class="form__field" id="custom" type="text" maxlength="8" hidden />
          </div>
          <p class="pane__hint" id="currency-hint"></p>
        </section>
        <!-- Feuille « Taille de l'affichage ». Le zoom du webview, celui du
             ⌘+ d'un navigateur : tout grossit ensemble, texte comme icônes
             comme colonnes. Grossir la seule police n'aurait presque rien
             bougé — les feuilles de style de Radinus portent 415 mesures en
             pixels contre 15 en em. -->
        <section class="pane" id="pane-zoom" hidden>
          <h2 class="pane__title" id="zoom-title"></h2>
          <div class="form">
            <label class="form__label" for="zoom" id="zoom-label"></label>
            <div class="zoom">
              <input class="zoom__slider" id="zoom" type="range" />
              <output class="zoom__value" id="zoom-value"></output>
              <button class="zoom__reset" id="zoom-reset" type="button"></button>
            </div>
          </div>
          <p class="pane__hint" id="zoom-hint"></p>
        </section>

        <!-- Feuille « Vérification », sous la branche « Importation » (Fabrice,
             03/10/2026). Ce que vaut la colonne « Vérification » sur une
             opération qui arrive d'un relevé ou d'un tableau : « Vérifiée »
             pour qui fait confiance à sa banque, « À vérifier » pour qui
             contrôle chaque ligne ticket en main. Une préférence de la base,
             comme la devise. -->
        <section class="pane" id="pane-verification" hidden>
          <h2 class="pane__title" id="verification-title"></h2>
          <div class="form">
            <label class="form__label" for="verification" id="verification-label"></label>
            <select class="form__field" id="verification"></select>
          </div>
          <p class="pane__hint" id="verification-hint"></p>
        </section>

        <!-- Feuille « Colonnes des tableaux » (Fabrice, 04/10/2026). Les
             colonnes se règlent dans le tableau lui-même — on glisse un
             en-tête, on coche au clic droit ; cette feuille n'offre que le
             retour à la disposition d'origine : un menu déroulant qui nomme
             la fenêtre, un bouton « Réinitialiser » pour ses tableaux, et
             « Tout réinitialiser » dessous. Le filet de qui ne comprend plus
             son tableau. Une préférence de la base : sans base, la feuille est
             grise.

             D'abord écrite avec une ligne et un bouton par tableau — neuf
             lignes, neuf boutons, et davantage à chaque tableau ajouté.
             Fabrice, le jour même : « ça fait beaucoup de boutons et de lignes
             pour rien. Il aurait mieux valu mettre un menu déroulant indiquant
             le nom de la fenêtre et un bouton réinitialiser. » Sans libellé
             devant : « tu mets simplement le nom de la fenêtre et
             réinitialiser, ça sera suffisamment clair ». -->
        <section class="pane" id="pane-columns" hidden>
          <h2 class="pane__title" id="columns-title"></h2>
          <div class="table-layouts">
            <select class="form__field table-layouts__window" id="columns-window"></select>
            <button class="table-layouts__reset" id="columns-reset" type="button"></button>
          </div>
          <button class="table-layouts__all" id="columns-reset-all" type="button"></button>
          <p class="pane__hint" id="columns-hint"></p>
        </section>

        <!-- La feuille « Réglages de confort » (Fabrice, 07/10/2026 : « il faut
             avoir un bouton pour remettre à zéro les réglages de confort mais
             pas le reste »). Un seul bouton : les colonnes de tous les
             tableaux, l'ordre et les cases des comptes de l'accueil, la taille
             de l'affichage. La langue, la devise et la vérification des
             opérations importées ne bougent pas — et la phrase le dit, pour
             qu'on n'ait pas à l'essayer pour le savoir. -->
        <section class="pane" id="pane-comfort" hidden>
          <h2 class="pane__title" id="comfort-title"></h2>
          <button class="table-layouts__reset" id="comfort-reset" type="button"></button>
          <p class="pane__hint" id="comfort-hint"></p>
        </section>

        <!-- La feuille « Relevés OFX », sous la branche « Importation »
             (Fabrice, 19/10/2026). Que faire du nom (NAME) et du mémo (MEMO)
             que la banque donne à chaque opération. Deux menus déroulants
             depuis le 20/10/2026 — deux cases « ne laissaient pas assez de
             liberté » : l'un pour le libellé, l'autre pour la référence
             paiement. Par défaut, le nom dans le libellé et le mémo dans la
             référence. Réglages du logiciel, comme ceux du QIF ; chaque menu
             a sa bulle. -->
        <section class="pane" id="pane-ofx" hidden>
          <h2 class="pane__title" id="ofx-title"></h2>
          <div class="form">
            <label class="form__label" for="ofx-label" id="ofx-label-label"></label>
            <select class="form__field" id="ofx-label">
              <option value="name" id="ofx-label-name"></option>
              <option value="memo" id="ofx-label-memo"></option>
              <option value="name-and-memo" id="ofx-label-name-and-memo"></option>
            </select>

            <label class="form__label" for="ofx-reference" id="ofx-reference-label"></label>
            <select class="form__field" id="ofx-reference">
              <option value="memo" id="ofx-reference-memo"></option>
              <option value="name" id="ofx-reference-name"></option>
              <option value="name-and-memo" id="ofx-reference-name-and-memo"></option>
              <option value="empty" id="ofx-reference-empty"></option>
            </select>
          </div>
          <p class="pane__hint" id="ofx-hint"></p>
        </section>

        <!-- La feuille « Relevés QIF », sous la branche « Importation »
             (Fabrice, 15/10/2026, P-73 : « tu crées dans les Préférences une
             petite section destinée à l'import de fichiers QIF, pour permettre
             à l'utilisateur de trancher, avec des choix par défaut »). Deux
             réglages **du logiciel**, dans `settings/radinus_config.json` et
             non dans la base : la feuille vit sans base ouverte. Chaque
             réglage a sa bulle. -->
        <section class="pane" id="pane-qif" hidden>
          <h2 class="pane__title" id="qif-title"></h2>
          <div class="form">
            <label class="form__label" for="qif-order" id="qif-order-label"></label>
            <select class="form__field" id="qif-order">
              <option value="ask" id="qif-order-ask"></option>
              <option value="day-month" id="qif-order-day-month"></option>
              <option value="month-day" id="qif-order-month-day"></option>
            </select>

            <label class="form__label" for="qif-label" id="qif-label-label"></label>
            <select class="form__field" id="qif-label">
              <option value="both" id="qif-label-both"></option>
              <option value="payee" id="qif-label-payee"></option>
              <option value="memo" id="qif-label-memo"></option>
            </select>
          </div>
          <p class="pane__hint" id="qif-hint"></p>
        </section>

        <!-- La feuille « Tarif d'électricité », sous la branche « Outils »
             (Fabrice, 09/10/2026 : « on pourra mémoriser cela, cela sera
             enregistré en tant que préférences et modifiable dans le panneau
             des préférences »). Le tarif que reprend l'outil « Consommation
             d'un appareil électrique ». Le bouton « Revenir au Tarif Bleu
             EDF » remplit les champs ; c'est la disquette qui enregistre. Une
             préférence de la base : sans base, la feuille est grise. -->
        <section class="pane" id="pane-electricity" hidden>
          <h2 class="pane__title" id="electricity-title"></h2>
          <div class="form">
            <label class="form__label" for="electricity-option" id="electricity-option-label"></label>
            <select class="form__field" id="electricity-option">
              <option value="base" id="electricity-option-base"></option>
              <option value="off-peak" id="electricity-option-off-peak"></option>
            </select>

            <label class="form__label" for="electricity-base" id="electricity-base-label"></label>
            <span class="electricity__price" id="electricity-base-line">
              <input class="form__field" id="electricity-base" inputmode="decimal" autocomplete="off" />
              <span class="electricity__unit" data-price-unit></span>
            </span>

            <label class="form__label" for="electricity-peak" id="electricity-peak-label"></label>
            <span class="electricity__price" id="electricity-peak-line">
              <input class="form__field" id="electricity-peak" inputmode="decimal" autocomplete="off" />
              <span class="electricity__unit" data-price-unit></span>
            </span>

            <label class="form__label" for="electricity-off-peak" id="electricity-off-peak-label"></label>
            <span class="electricity__price" id="electricity-off-peak-line">
              <input class="form__field" id="electricity-off-peak" inputmode="decimal" autocomplete="off" />
              <span class="electricity__unit" data-price-unit></span>
            </span>

            <label class="form__label" for="electricity-off-peak-hours" id="electricity-off-peak-hours-label"></label>
            <span class="electricity__price" id="electricity-off-peak-hours-line">
              <input class="form__field" id="electricity-off-peak-hours" inputmode="numeric" autocomplete="off" />
              <span class="electricity__unit" id="electricity-hours-unit"></span>
            </span>
          </div>
          <button class="table-layouts__reset" id="electricity-blue" type="button"></button>
          <p class="pane__hint" id="electricity-hint"></p>
        </section>

      </main>

      <aside class="panel">
        <button class="panel__button" id="save" type="button">
          <img src="/ui/assets/icons/Base_save.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar"></footer>
    </div>
  </body>
</html>
