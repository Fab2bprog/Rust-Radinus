<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Nouvelle base de données</title>
    <script type="module" src="/ui/windows/database-form.ts" defer></script>
  </head>

  <body>
    <!-- La fiche d'une base neuve (décision de Fabrice, 04/08/2026).

         Ces deux champs vivaient dans un coin du sélecteur, sous le tableau.
         Ils en sortent : **le bouton vert n'ajoute plus, il ouvre**. Une
         création est un geste à part entière, avec ses questions et sa
         validation, et non un formulaire posé à côté d'une liste qu'on est en
         train de parcourir.

         Gabarit des fiches de Radinus (03_CHARTE_GRAPHIQUE.md §3.3) : bandeau
         d'image à gauche, les champs au milieu, enregistrer et la porte à
         droite, la barre d'état en bas. Rien d'inventé pour cette fenêtre-ci.

         **La devise est demandée ici** (choix de Fabrice) alors qu'elle est
         une préférence de la base : la régler à la naissance évite d'ouvrir la
         base pour la seule chose qu'on sait déjà en la créant. -->
    <div class="window">
      <aside class="panel panel--left">
        <img
          class="panel__image"
          src="/ui/assets/icons/ImgRadinusClassement.png"
          alt=""
        />
      </aside>

      <main class="window__content window__content--scroll">
        <section class="band">
          <h2 class="band__title" id="group-identity"></h2>
          <div class="form form--wide">
            <label class="form__label" for="label" id="label-caption"></label>
            <input class="form__field" id="label" type="text" maxlength="120" />

            <label class="form__label" for="comment" id="comment-caption"></label>
            <textarea class="form__field" id="comment" rows="3"></textarea>
          </div>
        </section>

        <section class="band">
          <h2 class="band__title" id="group-currency"></h2>
          <div class="form form--wide">
            <label class="form__label" for="currency" id="currency-caption"></label>
            <select class="form__field form__field--medium" id="currency"></select>

            <label class="form__label" for="custom" id="custom-caption"></label>
            <input class="form__field form__field--medium" id="custom" type="text" maxlength="8" />
          </div>
          <!-- Ce que le système annonce : sans cette ligne, choisir « devise
               système » serait choisir à l'aveugle. Même règle qu'en F39. -->
          <p class="pane__hint" id="currency-hint"></p>
        </section>

        <!-- **La base peut naître pleine** (Fabrice, 04/08/2026). On désigne
             une archive ici, et la base créée en reçoit le contenu au moment
             de la validation — pas avant : tant qu'on n'a pas validé, aucune
             base n'existe et il n'y a rien à remplir. -->
        <section class="band">
          <h2 class="band__title" id="group-restore"></h2>
          <div class="database-form__restore">
            <button class="text-button" id="choose-backup" type="button"></button>
            <p class="pane__hint" id="backup-chosen"></p>
          </div>
        </section>
      </main>

      <aside class="panel">
        <button class="panel__button" id="save" type="button">
          <img src="/ui/assets/icons/Base_save.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar">…</footer>
    </div>
  </body>
</html>
