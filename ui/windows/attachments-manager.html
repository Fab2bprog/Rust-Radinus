<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/ui/windows/window.css" />
    <title>Radinus</title>
    <script type="module" src="/ui/windows/attachments-manager.ts" defer></script>
  </head>

  <body>
    <!-- « Gestion des pièces jointes » (Fabrice, 08/08/2026).
         Menu Paramètres, sous « Accès dossiers Radinus ».

         **Ce que la fenêtre des pièces jointes d'une opération ne peut pas
         faire** : voir l'ensemble. Celle-ci montre les pièces de *toutes* les
         opérations, et surtout les deux pannes silencieuses que rien ne
         montrait — une pièce dont le fichier a disparu du disque, et un
         fichier du dossier que plus aucune opération ne réclame.

         Une fenêtre liste de la grammaire de Radinus : le tableau au centre,
         la bande ardoise à droite, la barre bleue en bas. Trois gestes :
         ouvrir le document, le jeter à la corbeille, et sortir. -->
    <div class="window window--attachments-manager">
      <main class="window__content">
        <section class="list">
          <div class="list__header" id="header"></div>
          <div class="list__filter" id="filter"></div>
          <div class="list__rows" id="rows" role="listbox"></div>
        </section>
      </main>

      <aside class="panel">
        <button class="panel__button" id="open" type="button">
          <img src="/ui/assets/icons/Base_read.png" alt="" />
        </button>
        <button class="panel__button" id="remove" type="button">
          <img src="/ui/assets/icons/Base_delete.png" alt="" />
        </button>
        <span class="panel__spacer"></span>
        <button class="panel__button" id="close" type="button">
          <img src="/ui/assets/icons/zone_exit.png" alt="" />
        </button>
      </aside>

      <footer class="info-bar" id="info-bar">…</footer>
    </div>
  </body>
</html>
